name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Validate & Build Production Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go Unit Tests
        run: go test -v -race ./tests/...

- name: Compile Go WebAssembly Binary & Prepare Edge Runtime
        run: |
          mkdir -p build
          mkdir -p src
          curl -sSL "https://raw.githubusercontent.com/golang/go/release-branch.go1.22/misc/wasm/wasm_exec.js" -o src/wasm_exec.js
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o build/main.wasm ./cmd/worker/main.go

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: build/main.wasm
          retention-days: 1

  deploy-production:
    name: Apply D1 Migrations & Deploy Worker
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: build

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply D1 Database Migrations (Remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy Worker Infrastructure to Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
