name: Deploy Production Engine

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Build & Verify WASM Payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Execute Unit Tests
        run: go test -v -race ./tests/...

      - name: Build WebAssembly Target
        run: |
          mkdir -p build src
          curl -sSL "https://raw.githubusercontent.com/golang/go/release-branch.go1.22/misc/wasm/wasm_exec.js" -o src/wasm_exec.js
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o build/main.wasm ./cmd/worker/...

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            build/main.wasm
            src/wasm_exec.js
            src/index.js
            wrangler.toml
            migrations/
          retention-days: 1

  deploy-edge:
    name: Deploy to Cloudflare Network
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-build

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set Admin Hash Secret in Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_HASH: ${{ secrets.ADMIN_HASH }}
        run: |
          if [ -n "$ADMIN_HASH" ]; then
            printf "%s" "$ADMIN_HASH" | npx wrangler secret put ADMIN_HASH
          fi

      - name: Apply D1 Database Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy Worker Engine
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
