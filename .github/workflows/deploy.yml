name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    name: Validate & Build Production WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Unit & Integration Tests
        run: go test -v -race ./tests/...

      - name: Compile Go WebAssembly Binary
        run: |
          mkdir -p build
          mkdir -p src
          curl -sSL "https://raw.githubusercontent.com/golang/go/release-branch.go1.22/misc/wasm/wasm_exec.js" -o src/wasm_exec.js
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o build/main.wasm ./cmd/worker/...

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            build/main.wasm
            src/wasm_exec.js
            src/index.js
            wrangler.toml
            migrations/
          retention-days: 1

  deploy-production:
    name: Apply D1 Migrations & Deploy Worker
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inject Worker Secrets via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_HASH: ${{ secrets.ADMIN_HASH }}
        run: |
          if [ -n "$ADMIN_HASH" ]; then
            echo "$ADMIN_HASH" | npx wrangler secret put ADMIN_HASH
          fi

      - name: Apply D1 Database Migrations (Remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy Worker Infrastructure to Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
