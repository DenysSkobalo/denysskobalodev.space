name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    name: Go Quality Guard & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go Vet & Static Analysis
        run: |
          cd backend
          go vet ./...

      - name: Run Go Unit & Integration Tests
        run: |
          cd backend
          go test -v -race ./tests/...

      - name: Verify WebAssembly Compilation Build
        run: |
          cd backend
          GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/server/main.go
