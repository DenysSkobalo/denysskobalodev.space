name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    name: Go Quality Guard & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Vet & Static Analysis
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v -race ./tests/...

      - name: Verify WebAssembly Compilation Build
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/worker/...
